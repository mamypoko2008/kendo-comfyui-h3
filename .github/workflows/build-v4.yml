name: Build KENDO H3 V4
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: V4 image tag
        required: true
        default: v4.0.0-beta.2
      dockerfile:
        description: Image build definition
        type: choice
        options:
          - Dockerfile.v4-update
          - Dockerfile.v4
        default: Dockerfile.v4-update
  push:
    tags:
      - 'v4.*'
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: mcp
      - run: node --test tests/workflow.test.cjs tests/workflow-v3-beta.test.cjs tests/workflow-v4.test.cjs tests/mcp-v4.test.mjs
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -v
      - name: Free space for the CUDA image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile || 'Dockerfile.v4-update' }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kendo-comfyui-h3:${{ github.ref_type == 'tag' && github.ref_name || inputs.image_tag }}
          cache-from: type=gha,scope=v4
          cache-to: type=gha,scope=v4,mode=max
