name: Build KENDO H3 V3 for Vast.ai

on:
  workflow_dispatch:
  push:
    tags:
      - 'vast-v3.*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: mcp
      - run: node --test tests/workflow.test.cjs tests/workflow-v3-beta.test.cjs tests/mcp-v3-beta.test.mjs
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vast-v3
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kendo-comfyui-h3:${{ github.ref_name }}
          cache-from: type=gha,scope=vast-v3
          cache-to: type=gha,scope=vast-v3,mode=max
